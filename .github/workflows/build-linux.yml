name: Build Linux application

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: symul-linux-build-${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyInstaller

      - name: Build application bundle
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name Symul-Browser \
            --onedir \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --distpath dist \
            --workpath build \
            --specpath build \
            main.py
          test -x dist/Symul-Browser/Symul-Browser

      - name: Package Linux x86_64 bundle
        run: tar -czf symul-browser-linux-x86_64.tar.gz -C dist Symul-Browser

      - name: Select upload release
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            # A single rolling release is updated on every push to main.
            echo "tag=main" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: Symul Browser ${{ steps.target.outputs.tag }}
          prerelease: ${{ steps.target.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.target.outputs.latest == 'true' && 'true' || 'false' }}
          overwrite_files: true
          files: symul-browser-linux-x86_64.tar.gz
          body: |
            Automatically built Linux x86_64 application bundle.
            Builds from pushes to main are experimental; published version releases are built from their release tag.
